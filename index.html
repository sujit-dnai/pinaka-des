<!DOCTYPE html>
<html>
<head>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#001F3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pinaka">
<link rel="apple-touch-icon" href="assets/pinaka-icon-192.png">
<link rel="icon" href="assets/pinaka-icon-192.png">
<title>Pinaka</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#001F3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pinaka">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/pinaka-icon-192.png">
<link rel="icon" href="assets/pinaka-icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#001F3F;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}a{color:#0074D9}a:hover{color:#0060B5}.pd i{font-family:'Material Symbols Rounded';font-style:normal;font-size:22px;line-height:1;display:inline-block;font-feature-settings:'liga'}.pd *{box-sizing:border-box}.pd button{font-family:'IBM Plex Sans',sans-serif;cursor:pointer}</style>
</helmet>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#001F3F"></rect><text x="50" y="64" font-family="Arial" font-weight="700" font-size="44" fill="#fff" text-anchor="middle">P</text></svg></template>
<div class="pd" style="position:fixed;inset:0;background:#001F3F;font-family:'IBM Plex Sans',system-ui,sans-serif;overflow:hidden">
  <div style="position:absolute;left:50%;top:50%;width:{{ W }}px;height:{{ H }}px;transform:translate(-50%,-50%) scale({{ k }});transform-origin:center center">
    <sc-if value="{{ c.FullApp }}" hint-placeholder-val="{{ true }}"><dc-import name="FullApp" platform="{{ plat }}" theme="{{ theme }}" scene="{{ scene }}" hint-size="360px,800px"></dc-import></sc-if>
    <sc-if value="{{ c.CaseSync }}" hint-placeholder-val="{{ false }}"><dc-import name="CaseSync" platform="{{ plat }}" theme="{{ theme }}" scene="{{ scene }}" hint-size="360px,800px"></dc-import></sc-if>
    <sc-if value="{{ c.VerifyApp }}" hint-placeholder-val="{{ false }}"><dc-import name="VerifyApp" platform="{{ plat }}" theme="{{ theme }}" scene="{{ scene }}" hint-size="360px,800px"></dc-import></sc-if>
    <sc-if value="{{ c.ExpenseApp }}" hint-placeholder-val="{{ false }}"><dc-import name="ExpenseApp" platform="{{ plat }}" theme="{{ theme }}" scene="{{ scene }}" hint-size="360px,800px"></dc-import></sc-if>
    <sc-if value="{{ c.TranslatorApp }}" hint-placeholder-val="{{ false }}"><dc-import name="TranslatorApp" platform="{{ plat }}" theme="{{ theme }}" scene="{{ scene }}" hint-size="360px,800px"></dc-import></sc-if>
    <sc-if value="{{ c.TrackApp }}" hint-placeholder-val="{{ false }}"><dc-import name="TrackApp" platform="{{ plat }}" theme="{{ theme }}" scene="{{ scene }}" hint-size="360px,800px"></dc-import></sc-if>
    <sc-if value="{{ c.ClientApp }}" hint-placeholder-val="{{ false }}"><dc-import name="ClientApp" platform="{{ plat }}" theme="{{ theme }}" scene="{{ scene }}" hint-size="360px,800px"></dc-import></sc-if>
    <sc-if value="{{ c.FinalReport }}" hint-placeholder-val="{{ false }}"><dc-import name="FinalReport" platform="{{ plat }}" theme="{{ theme }}" product="health" scene="{{ scene }}" hint-size="360px,800px"></dc-import></sc-if>
    <sc-if value="{{ c.SharedCase }}" hint-placeholder-val="{{ false }}"><dc-import name="SharedCase" platform="{{ plat }}" theme="{{ theme }}" viewer="sujit" scene="{{ scene }}" hint-size="360px,800px"></dc-import></sc-if>
    <sc-if value="{{ c.MentionChat }}" hint-placeholder-val="{{ false }}"><dc-import name="MentionChat" platform="{{ plat }}" theme="{{ theme }}" scene="{{ scene }}" hint-size="360px,800px"></dc-import></sc-if>
  </div>

  <button onClick="{{ openMenu }}" aria-label="Screens" style="position:absolute;left:0;top:42%;width:30px;height:64px;border:0;border-radius:0 14px 14px 0;background:rgba(0,31,63,.82);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.3)"><i style="font-size:19px">apps</i><span style="font-size:9px;font-weight:700">{{ pos }}</span></button>
  <button onClick="{{ next }}" aria-label="Next screen" style="position:absolute;left:0;top:calc(42% + 70px);width:30px;height:44px;border:0;border-radius:0 12px 12px 0;background:rgba(0,116,217,.85);color:#fff;display:grid;place-items:center;z-index:100"><i style="font-size:22px">chevron_right</i></button>

  <sc-if value="{{ menuOn }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;inset:0;z-index:200;background:#F4F7FB;display:flex;flex-direction:column;color:#0B2540">
    <div style="flex:none;background:linear-gradient(135deg,#001F3F,#0074D9);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;display:flex;align-items:center;gap:12px">
      <img src="assets/pinaka-icon-192.png" alt="" style="width:40px;height:40px;border-radius:10px">
      <div style="flex:1"><b style="font-size:18px">Pinaka · demo</b><div style="font-size:12px;opacity:.8">Sample data · tap a screen</div></div>
      <button onClick="{{ closeMenu }}" style="width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center"><i>close</i></button>
    </div>
    <div style="flex:none;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 16px 4px">
      <button onClick="{{ prev }}" style="height:44px;border-radius:12px;border:1.5px solid #D7E2EF;background:#fff;color:#0B2540;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px"><i style="font-size:20px">chevron_left</i>Back</button>
      <button onClick="{{ toggleTheme }}" style="height:44px;border-radius:12px;border:1.5px solid #D7E2EF;background:#fff;color:#0B2540;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px"><i style="font-size:19px">{{ themeIc }}</i>{{ themeLabel }}</button>
      <button onClick="{{ nextClose }}" style="height:44px;border-radius:12px;border:0;background:#0074D9;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px">Next<i style="font-size:20px">chevron_right</i></button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:8px 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:14px">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="10">
        <div style="display:flex;flex-direction:column;gap:6px"><b style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#5A708C">{{ g.n }}</b>
          <div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4"><button onClick="{{ it.go }}" style="min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid {{ it.bd }};background:{{ it.bg }};color:{{ it.fg }};font-size:13.5px;font-weight:600">{{ it.label }}</button></sc-for></div>
        </div>
      </sc-for>
      <div style="background:#fff;border:1px solid #D7E2EF;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;color:#33475B"><b style="display:block;color:#0B2540;margin-bottom:4px">Install on the phone</b>Android (Chrome): ⋮ menu → Install app / Add to Home screen.<br>iPhone (Safari): Share → Add to Home Screen.<br>This is a demo with sample data. It has no real GPS, camera, alarm or portal connection.</div>
    </div>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const FLOW=[
 ['Sign in',[['FullApp','login','Login'],['FullApp','pin','PIN'],['FullApp','punch','Punch'],['FullApp','late','Late punch'],['CaseSync','commit','Morning plan']]],
 ['Home',[['FullApp','homeA','Home A'],['FullApp','homeB','Home B'],['FullApp','homeC','Home C · map']]],
 ['New case',[['CaseSync','push','Notification'],['CaseSync','alarm','Accept 20:00'],['CaseSync','night','Night case'],['CaseSync','missed','Missed ₹50']]],
 ['Cases',[['CaseSync','list','My Cases'],['FullApp','cardsB','Cards B'],['FullApp','cardsC','Cards C'],['CaseSync','ws','Workspace'],['SharedCase','cases','Shared case']]],
 ['Touch points',[['VerifyApp','tp','Touch points'],['VerifyApp','camA','Camera A'],['VerifyApp','camB','Camera B'],['VerifyApp','camC','Camera C'],['VerifyApp','stamp','GPS stamp']]],
 ['Timers',[['VerifyApp','hStart','Health 24 h'],['VerifyApp','h8','Health 8 h'],['VerifyApp','hMoved','Health moved'],['VerifyApp','mDay3','Motor day 3'],['VerifyApp','mFine','Motor ₹50']]],
 ['Report and expenses',[['FinalReport','wsReady','Final Report'],['ExpenseApp','trip','Travel expense'],['ExpenseApp','list','Expenses'],['ExpenseApp','create','New expense'],['ExpenseApp','missed','Missed expense']]],
 ['Voice',[['TranslatorApp','fr','Translator'],['TranslatorApp','result','Voice result']]],
 ['Team',[['MentionChat','casecard','Team Chat'],['CaseSync','meet','Meeting ring'],['CaseSync','gps','GPS off']]],
 ['Evening and profile',[['FullApp','today','Today\'s work'],['FullApp','todayMissed','Missed updates'],['FullApp','profile','Profile'],['CaseSync','fines','Fine Amount'],['CaseSync','appeal','Appeal'],['TrackApp','moving','On duty'],['TrackApp','oem','Battery setup']]],
 ['Insurer client',[['ClientApp','home','Client home'],['ClientApp','list','Client cases'],['ClientApp','detail','Case progress'],['ClientApp','approve','Approve charge'],['ClientApp','urgent','Urgent release'],['ClientApp','report','Released report']]]];
const ALL=FLOW.flatMap(([g,items])=>items);
const COMPS=['FullApp','CaseSync','VerifyApp','ExpenseApp','TranslatorApp','TrackApp','ClientApp','FinalReport','SharedCase','MentionChat'];
class Component extends DCLogic {
  state=(()=>{ let s={i:0,theme:'light'}; try{ const v=JSON.parse(localStorage.getItem('pinakaDemo')||'{}'); if(typeof v.i==='number') s.i=Math.min(ALL.length-1,Math.max(0,v.i)); if(v.theme) s.theme=v.theme; }catch(e){} return {...s,menu:false,vw:window.innerWidth,vh:window.innerHeight}; })();
  componentDidMount(){ this.rs=()=>this.setState({vw:window.innerWidth,vh:window.innerHeight}); window.addEventListener('resize',this.rs); if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  componentWillUnmount(){ window.removeEventListener('resize',this.rs); }
  save(p){ this.setState(p,()=>{ try{ localStorage.setItem('pinakaDemo',JSON.stringify({i:this.state.i,theme:this.state.theme})); }catch(e){} }); }
  renderVals(){
    const S=this.state, cur=ALL[S.i], ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
    const W=ios?390:360,H=ios?844:800, k=Math.min(S.vw/W,S.vh/H);
    const c={}; COMPS.forEach(n=>c[n]=cur[0]===n);
    return {W,H,k,c,plat:ios?'ios':'android',theme:S.theme,scene:cur[1],pos:(S.i+1)+'/'+ALL.length,
      menuOn:S.menu,openMenu:()=>this.setState({menu:true}),closeMenu:()=>this.setState({menu:false}),
      next:()=>this.save({i:(S.i+1)%ALL.length}),prev:()=>this.save({i:(S.i-1+ALL.length)%ALL.length}),nextClose:()=>this.save({i:(S.i+1)%ALL.length,menu:false}),
      toggleTheme:()=>this.save({theme:S.theme==='dark'?'light':'dark'}),themeIc:S.theme==='dark'?'light_mode':'dark_mode',themeLabel:S.theme==='dark'?'Light':'Dark',
      groups:FLOW.map(([n,items])=>({n,items:items.map(it=>{ const idx=ALL.indexOf(it), on=idx===S.i; return {label:it[2],bg:on?'#0074D9':'#fff',fg:on?'#fff':'#0B2540',bd:on?'#0074D9':'#D7E2EF',go:()=>this.save({i:idx,menu:false})}; })}))};
  }
}
</script>
</body>
</html>
