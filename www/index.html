<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#001F3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pinaka">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Pinaka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
<style>
/* Pinaka · TaaSen field officer app · v2.0 (portal v34.9)
   Built to Sujit's design, github.com/sujit-dnai/pinaka-des ("Pinaka Full App"): the design's own
   colour tokens, type (IBM Plex Sans / Mono), icons (Material Symbols Rounded) and screens.
   One file for Chrome on a laptop (taasenclaims.com/pinaka), Android (Capacitor) and, later, iPhone.
   Chosen by Sujit, 27-Sep: Home A (next action), the My Cases list, camera B (photos-needed checklist). */
:root{--f:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--m:'IBM Plex Mono',ui-monospace,monospace;
  --bg:#EEF3F9;--card:#FFFFFF;--ink:#0B2540;--body:#33475B;--mut:#5A708C;--line:#D7E2EF;--line2:#E7EEF6;--sky:#E3F0FC;--blue:#0074D9;--link:#0060B5;
  --grad:linear-gradient(135deg,#001F3F 0%,#0074D9 100%);--fld:#F6F9FD;--ok:#1E7A3D;--okt:#E4F6EA;--okb:#2E9E4B;--red:#A3271B;--redt:#FCE9E7;--redb:#D93A2B;--amb:#9A6A00;--ambt:#FFF3D6;--map:#E4ECF4;--mapl:#D0DCE8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#07111D;--card:#0E1C2E;--ink:#E7EEF7;--body:#C3D0DE;--mut:#93A6BC;--line:#22374F;--line2:#1A2C42;--sky:#14304F;--blue:#5AAEF5;--link:#7CC0FF;--grad:linear-gradient(135deg,#000E1C 0%,#0A4B8C 100%);--fld:#0A1726;--ok:#6FD39A;--okt:#0F2E1E;--okb:#2E9E4B;--red:#FF9A8C;--redt:#3A1612;--redb:#C8382A;--amb:#F5BE6A;--ambt:#35260E;--map:#0C1A2A;--mapl:#15283D}}
:root[data-theme="dark"]{--bg:#07111D;--card:#0E1C2E;--ink:#E7EEF7;--body:#C3D0DE;--mut:#93A6BC;--line:#22374F;--line2:#1A2C42;--sky:#14304F;--blue:#5AAEF5;--link:#7CC0FF;--grad:linear-gradient(135deg,#000E1C 0%,#0A4B8C 100%);--fld:#0A1726;--ok:#6FD39A;--okt:#0F2E1E;--okb:#2E9E4B;--red:#FF9A8C;--redt:#3A1612;--redb:#C8382A;--amb:#F5BE6A;--ambt:#35260E;--map:#0C1A2A;--mapl:#15283D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#001F3F;color:var(--ink);font:400 15px/1.4 var(--f);overscroll-behavior:none}
@media (min-width:600px){html,body{background:linear-gradient(135deg,#001F3F,#0A3D73)}}
button,input,select,textarea{font-family:var(--f);color:inherit}
button{cursor:pointer}
a{color:var(--link)}
i.ic,.ic{font-family:'Material Symbols Rounded';font-style:normal;font-weight:normal;font-size:22px;line-height:1;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased;font-feature-settings:'liga';letter-spacing:0;text-transform:none;vertical-align:middle}
.fill{font-variation-settings:'FILL' 1}
.noicons .ic{visibility:hidden;font-size:0 !important}.fb{display:none}.noicons .fb{display:inline}
.mono{font-family:var(--m);font-weight:500}
/* the phone frame: full screen on a phone, a centred phone-sized column in Chrome on a laptop */
#app{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){#app{top:16px;bottom:16px;border-radius:26px;box-shadow:0 20px 60px #0008}}
.scr{flex:1;min-height:0;display:flex;flex-direction:column}
.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:12px;display:flex;flex-direction:column;gap:12px}
/* header */
.hd{background:var(--grad);color:#fff;flex:none;min-height:56px;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 0px) 12px 0}
.hd img{width:32px;height:32px;border-radius:8px;background:#fff;object-fit:contain;padding:2px}
.hd .t{flex:1;min-width:0}.hd .t b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .t small{display:block;font:500 11px var(--m);opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hchip{height:28px;padding:0 9px;border-radius:14px;background:rgba(255,255,255,.18);font-size:12px;font-weight:600;display:flex;align-items:center;gap:3px;border:0;color:#fff}
.hbtn{width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.18);display:grid;place-items:center;border:0;color:#fff;position:relative;flex:none}
.hbtn .dot{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:4px;background:#FF6B5B}
/* bottom nav */
.nav{flex:none;height:64px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);box-sizing:content-box}
.nav button{border:0;background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;position:relative}
.nav button .pl{width:52px;height:30px;border-radius:15px;display:grid;place-items:center}
.nav button.on{color:var(--link)}.nav button.on .pl{background:var(--sky)}
.nav .bdg{position:absolute;top:6px;right:14px;min-width:16px;height:16px;border-radius:8px;background:var(--redb);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.foot{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px}
/* building blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.card.big{border-radius:18px;padding:14px}
.chip{height:28px;padding:0 10px;border-radius:14px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip .ic{font-size:16px}
.c-ok{background:var(--okt);color:var(--ok)}.c-red{background:var(--redt);color:var(--red)}.c-amb{background:var(--ambt);color:var(--amb)}.c-sky{background:var(--sky);color:var(--link)}.c-line{background:var(--card);border:1px solid var(--line);color:var(--body)}
.tag{height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag .ic{font-size:14px}
.btn{height:50px;border-radius:12px;border:0;font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 12px}
.btn .ic{font-size:21px}
.btn.grad{background:var(--grad);color:#fff}.btn.green{background:var(--okb);color:#fff}.btn.redb{background:var(--redb);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.btn.soft{background:var(--sky);color:var(--link)}.btn.rej{background:var(--card);border:1.5px solid var(--line);color:var(--red)}
.btn:disabled{opacity:.55}
.btn.sm{height:40px;font-size:14px;border-radius:10px}
.lbl{font-size:13px;color:var(--mut);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.lbl .req{color:var(--redb)}
.inp{width:100%;height:52px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;background:var(--fld);color:var(--ink);outline:none}
.inp:focus{border-color:var(--blue)}
textarea.inp{height:auto;min-height:72px;padding:10px 12px;font-size:14.5px;resize:vertical}
select.inp{appearance:auto}
.ifld{height:52px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;display:flex;align-items:center;gap:8px;background:var(--card)}
.ifld:focus-within{border-color:var(--blue)}
.ifld .ic{color:var(--mut)}
.ifld input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink);height:100%}
.row{display:flex;align-items:center;gap:8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mut{color:var(--mut)}.small{font-size:12.5px}.sub{font:500 12px var(--m);color:var(--mut)}
.err{background:var(--redt);color:var(--red);border-radius:12px;padding:10px 12px;font-size:13.5px}
.banner{border-radius:14px;padding:12px;display:flex;gap:10px;font-size:13.5px}
.banner b{display:block}
.b-ok{background:var(--okt);color:var(--ok)}.b-red{background:var(--redt);color:var(--red)}.b-amb{background:var(--ambt);color:var(--amb)}.b-sky{background:var(--sky);color:var(--link)}
.banner span.d{color:var(--body)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}.kv span{color:var(--mut)}
.mini{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;width:100%}
.mini b{font-size:14.5px;font-weight:600}
.kpi{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);text-align:left}
.kpi b{font-size:22px}.kpi div{font-size:12px;color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chips button{height:34px;padding:0 12px;border-radius:17px;border:1.5px solid var(--line);background:var(--card);color:var(--body);font-size:13px;font-weight:600;white-space:nowrap}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.ccard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.ccard.new{border-color:var(--blue)}.ccard.out{border-color:var(--redb)}
.ccard .nm{font-size:16px;font-weight:700}
.dotl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--body)}.dotl i.d{width:8px;height:8px;border-radius:4px;display:inline-block}
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden}.bar i{display:block;height:100%}
.tl{display:flex;flex-direction:column}.tl .st{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:6px 0;align-items:start}
.tl .st .ic{font-size:19px}.tl .st b{font-size:14px;font-weight:600;display:block}.tl .st small{font-size:12px;color:var(--mut)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.tool .cir{width:46px;height:46px;border-radius:23px;background:var(--sky);color:var(--blue);display:grid;place-items:center}
.tool b{font-size:14px}.tool small{font-size:11.5px;color:var(--mut)}
.menu{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.menu button{display:grid;grid-template-columns:40px 1fr auto 20px;gap:10px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line2);background:transparent;width:100%;text-align:left;color:var(--ink)}
.menu .cir{width:36px;height:36px;border-radius:18px;display:grid;place-items:center}
.menu span.n{font-size:15px;font-weight:500}.menu span.v{font-size:13px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{height:44px;border-radius:9px;border:0;background:transparent;color:var(--mut);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,31,63,.15)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.yn button{height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:4px}
.yn button.y.on{background:var(--okb);border-color:var(--okb);color:#fff}.yn button.n.on{background:var(--redb);border-color:var(--redb);color:#fff}
.mic{border-radius:10px;background:var(--sky);color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;border:0;min-width:56px;min-height:48px}
.mic .ic{font-size:21px}
.withmic{display:grid;grid-template-columns:1fr 56px;gap:8px}
.vchip{display:inline-flex;align-items:center;gap:6px;background:var(--ambt);color:var(--amb);border-radius:14px;padding:4px 10px;font-size:12px;font-weight:600;border:0;margin-top:6px}
.vchip.ok{background:var(--okt);color:var(--ok)}
.empty{text-align:center;padding:32px 16px;color:var(--mut)}.empty .ic{font-size:44px;color:var(--blue);display:block;margin:0 auto 8px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}.thumbs img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
/* full-screen dark scenes: login hero, punch, camera, alarm, lock */
.dark{background:#02101E;color:#fff}
.hero{background:var(--grad);color:#fff}
.sheetw{flex:1;background:var(--card);color:var(--ink);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:12px 22px;justify-content:center}
.pinpad button{width:76px;height:64px;border-radius:32px;border:0;background:var(--bg);color:var(--ink);font-size:24px;font-weight:500;display:grid;place-items:center}
.pinpad button.x{background:transparent}
.pdots{display:flex;gap:14px;margin:14px 0 20px;justify-content:center}.pdots span{width:16px;height:16px;border-radius:8px;border:2px solid var(--blue)}.pdots span.f{background:var(--blue)}
.cam{position:relative;flex:1;min-height:0;border-radius:22px;overflow:hidden;background:linear-gradient(170deg,#3A4A5C,#1A2430)}
.cam video,.cam img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stamp{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:64px 1fr;gap:8px;background:rgba(0,0,0,.6);border-radius:10px;padding:6px;font-size:11px;line-height:1.35;color:#fff}
.stamp .mp{height:56px;border-radius:6px;background:linear-gradient(135deg,#7FA3C7,#C9D8E8);position:relative}
.stamp .mp:after{content:'';position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:5px;background:#D93A2B;border:2px solid #fff}
.shutter{width:72px;height:72px;border-radius:36px;border:4px solid #fff;background:rgba(255,255,255,.2)}
.ring{width:190px;height:190px;border-radius:50%;border:8px solid rgba(255,255,255,.25);display:grid;place-items:center;margin:0 auto;position:relative}
.ring b{font:600 44px var(--m)}
/* sheets + toast */
.sheet{position:fixed;inset:0;z-index:60;background:#0009;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in2{background:var(--card);color:var(--ink);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px;min-height:48px;color:var(--ink)}
.opt.on{border-color:var(--blue);background:var(--sky)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0B2540;color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;z-index:90;display:none;max-width:90vw;text-align:center;font-size:14px}
.toast.on{display:block}
#alarm{position:fixed;inset:0;z-index:50;display:none;justify-content:center;background:#001F3F}
#alarm.on{display:flex}
#alarm .wrap{width:100%;max-width:480px;display:flex;flex-direction:column;background:linear-gradient(180deg,#001F3F 0%,#003B73 45%,var(--bg) 45%);color:#fff}
.bigmic{width:112px;height:112px;border-radius:50%;margin:14px auto;display:grid;place-items:center;background:var(--grad);color:#fff}
.bigmic .ic{font-size:52px}.bigmic.rec{animation:pulse 1.2s infinite}
.lvl{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.lvl i{display:block;height:100%;width:0;background:var(--okb);transition:width .1s}
.thin{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0}.thin i{display:block;height:100%;width:40%;background:var(--blue);animation:slide 1.1s infinite ease-in-out}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ffffff66}70%{box-shadow:0 0 0 28px #ffffff00}100%{box-shadow:0 0 0 0 #ffffff00}}
.spin{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.ms{font-family:'Material Symbols Rounded';font-style:normal;font-weight:normal;font-size:22px;line-height:1;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased;font-feature-settings:'liga';vertical-align:middle}
.noicons .ms{visibility:hidden;font-size:0 !important}
.btn.p{background:var(--grad);color:#fff}.btn.ok{background:var(--okb);color:#fff}.btn.g{background:var(--sky);color:var(--link)}.btn.no{background:var(--card);border:1.5px solid var(--redb);color:var(--red)}
textarea.in,input.in,select.in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;background:var(--fld);color:var(--ink);outline:none}
h2{font-size:17px;margin:0 0 8px;color:var(--ink)}
/* v34.9 — Team Chat (@mentions) + the document scanner */
.hbtn .chcnt{position:absolute;top:-3px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:#FF6B5B;color:#fff;font:700 10px var(--f);display:grid;place-items:center;padding:0 4px}
.hbtn .chat{position:absolute;bottom:-3px;right:-4px;width:17px;height:17px;border-radius:9px;background:#F0A500;color:#001F3F;font:800 11px var(--f);display:grid;place-items:center}
.chmini{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--link);margin-left:8px}.chmini .ic{font-size:16px}.chmini b{background:#F0A500;color:#001F3F;border-radius:8px;padding:0 4px;margin-left:2px}
.chat2{background:#F0A500;color:#001F3F;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;font-weight:800;font-size:11px}
.chcnt2{background:var(--redb);color:#fff;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;font-weight:700;font-size:11px;padding:0 5px}
.chav{width:30px;height:30px;border-radius:15px;background:#001F3F;color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.chrow{display:flex;gap:8px;align-items:flex-end;border-radius:12px;padding:2px 4px}
.chrow.me{justify-content:flex-end}
.chrow.you{background:rgba(240,165,0,.13)}
.chrow.flash{animation:chflash 1.1s 3}
@keyframes chflash{0%,100%{background:transparent}30%,70%{background:rgba(240,165,0,.38)}}
.chcol{display:flex;flex-direction:column;align-items:flex-start;max-width:80%}.chrow.me .chcol{align-items:flex-end}
.chb{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 11px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word;color:var(--ink);max-width:100%}
.chrow.me .chb{background:#001F3F;border-color:#001F3F;color:#fff;border-radius:16px 16px 4px 16px}
.chn{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:2px}
.cht{display:block;font-size:10.5px;color:var(--mut);margin-top:3px;text-align:right}.chrow.me .cht{color:#9FD0FF}.cht .ic{font-size:13px}
.chq{display:flex;flex-direction:column;border-left:3px solid var(--blue);background:rgba(0,116,217,.08);border-radius:6px;padding:4px 8px;margin-bottom:5px;font-size:12px}
.chq .ic{display:none}.chrow.me .chq{background:rgba(255,255,255,.12);border-color:#9FD0FF}
.chm{color:var(--link);font-weight:700;cursor:pointer}.chrow.me .chm{color:#9FD0FF}.chm.left{color:var(--mut);font-weight:500;cursor:default}.chm small{font-size:10px;background:var(--line2);border-radius:6px;padding:0 4px}
.chyou{display:inline-block;background:#F0A500;color:#001F3F;border-radius:6px;font-size:10px;font-weight:800;padding:1px 6px;margin-bottom:3px}
.chrep{border:0;background:none;color:var(--mut);font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:2px;padding:2px 4px}.chrep .ic{font-size:15px}
.chpop{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(2,32,64,.22);max-height:260px;overflow:auto;display:none;z-index:5}
.chpop button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 12px;text-align:left;color:var(--ink);font-size:14px}
.chpop button small{display:block;color:var(--mut);font-size:11.5px}.chpop button:first-of-type{background:var(--sky)}
.chreply{display:flex;align-items:center;gap:8px;background:var(--sky);border-left:3px solid var(--blue);border-radius:8px;padding:6px 8px;font-size:12.5px}.chreply b,.chreply span span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chreply button{border:0;background:none;color:var(--mut)}
.chtag{display:inline-flex;align-items:center;gap:2px;background:var(--sky);color:var(--link);border-radius:14px;padding:3px 4px 3px 10px;font-size:13px;font-weight:700;white-space:nowrap}.chtag button{border:0;background:none;color:var(--mut);padding:0}.chtag .ic{font-size:16px}
#scanwrap{position:fixed;inset:0;z-index:85;background:#000;display:flex;justify-content:center}
#scanwrap .scin{width:100%;max-width:480px;display:flex;flex-direction:column;color:#fff;background:#02101E}
.scbar{padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;display:flex;align-items:center;gap:10px}
.scbox{position:absolute;border:3px dashed rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);transition:border-color .15s;pointer-events:none}
.scbox.near{border-color:#F0A500;border-style:solid}.scbox.ok{border-color:#2E9E4B;border-style:solid;box-shadow:0 0 0 2000px rgba(0,0,0,.35),inset 0 0 0 3px rgba(46,158,75,.5)}
.scbox span{position:absolute;left:50%;top:-34px;transform:translateX(-50%);white-space:nowrap;background:rgba(0,0,0,.65);border-radius:14px;padding:4px 12px;font-size:12.5px;font-weight:600}
.scbox.ok span{background:#2E9E4B}.scbox.near span{background:#9A6A00}
.scctl{padding:14px 12px calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:40px}
.scsq{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.15);display:grid;place-items:center;border:0;color:#fff;line-height:1}.scsq small{font-size:10px;display:block}
.scctl2{padding:10px 12px calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.scstage{position:relative;flex:1;min-height:0;margin:0 12px;display:flex;align-items:center;justify-content:center;touch-action:none}
.scstage canvas{position:absolute;border-radius:4px}
.schd{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:15px;background:rgba(46,158,75,.35);border:3px solid #2E9E4B;touch-action:none;cursor:grab;z-index:2}
.scgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 12px;align-content:start}
.scpg{position:relative;aspect-ratio:1/1.414;border-radius:8px;overflow:hidden;background:#fff;border:0;padding:0}
.scpg img{width:100%;height:100%;object-fit:cover}.scpg span{position:absolute;left:4px;bottom:4px;background:#001F3F;color:#fff;border-radius:8px;font-size:11px;font-weight:700;padding:1px 7px}
.scpg button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:14px;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}.scpg button .ic{font-size:17px}
.scpg.add{background:rgba(255,255,255,.1);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed rgba(255,255,255,.35)}
.sosb{height:32px;min-width:44px;padding:0 9px;border-radius:16px;border:2px solid #fff;background:#D93A2B;color:#fff;font:800 12.5px var(--f);letter-spacing:.04em;flex:none}
.sosb.on{animation:pulse 1.2s infinite}

    .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'The portal answered ' + r.status }; }).then(function (j) { j._status = r.status; return j; }); })

  var nowHM = new Date(Date.now() + 330 * 60000).toISOString().slice(11, 16);
  var promised = list.filter(function (c) { return c.promise && c.promise.state !== 'later'; }).sort(function (a, b) { return String(a.promise.dueTime).localeCompare(String(b.promise.dueTime)); })[0];
  if (promised) return promised;
  return withPlan.filter(function (c) { return c.plan.time >= nowHM && !c.updatedToday; })[0] || withPlan[0] || list.filter(function (c) { return c.outTat; })[0] || list[0] || null;
}
function vHome() {
  var d = state.day || {}, n = nextCase();
  var out = state.cases.filter(function (c) { return c.outTat; }).length, due = state.cases.filter(function (c) { return c.tatLeftH != null && c.tatLeftH >= 0 && c.tatLeftH < 24; }).length;
  var chips = '<div class="row" style="flex-wrap:wrap">' + (d.punch ? '<span class="chip c-ok">' + ic('how_to_reg') + S('punched') + ' ' + tm(d.punch.at) + (d.punch.late ? ' · Late' : '') + '</span>' : '<button class="chip c-amb" style="border:0" data-act="nav" data-v="punch">' + ic('how_to_reg') + S('punchT') + '</button>') +
    (state.onDuty ? '<button class="chip c-line" data-act="dutyOff">' + ic('my_location') + S('onDuty') + '</button>' : '<button class="chip c-line" data-act="dutyOn">' + ic('location_off') + S('offDuty') + '</button>') +
    (!alarmReady() ? '<button class="chip c-red" style="border:0" data-act="enablePush">' + ic('notifications_off') + S('turnOn') + '</button>' : '') + '</div>';
  var waiting = state.alarms.length ? '<button class="btn redb" data-act="bell">' + ic('notifications_active') + S('newc') + ' · ' + state.alarms.length + '</button>' : '';
  var np = n && n.promise && n.promise.state !== 'later';
  var nx = n ? '<div class="card big" style="border:1.5px solid ' + (np ? 'var(--redb)' : 'var(--blue)') + ';display:flex;flex-direction:column;gap:10px"><span style="font-size:12px;font-weight:700;color:' + (np ? 'var(--red)' : 'var(--link)') + ';text-transform:uppercase;letter-spacing:.06em">' + (np ? 'Promised for today' + (n.promise.dueTime ? ' · ' + esc(n.promise.dueTime) : '') : S('next') + (n.plan ? ' · ' + S('planned') + ' ' + esc(n.plan.time || '') : '')) + '</span>' +
    '<div><b style="font-size:18px">' + esc(n.insured || '—') + (n.plan ? ' · ' + esc(String(n.plan.plan).toLowerCase()) : '') + '</b><div class="sub">' + esc(n.claim) + ' · ' + esc(n.client) + '</div></div>' +
    (place(n) ? '<div class="row" style="font-size:13px;color:var(--body)">' + ic('location_on') + esc(place(n)) + '</div>' : '') +
    '<div class="row2">' + (mapLink(n) ? '<a class="btn ghost" style="height:46px;text-decoration:none" href="' + esc(mapLink(n)) + '" target="_blank" rel="noopener">' + ic('directions') + S('navigate') + '</a>' : '<span></span>') + '<button class="btn grad" style="height:46px" data-act="open" data-c="' + esc(n.claim) + '">' + ic('play_arrow') + S('openCase') + '</button></div></div>' : '';
  var kpis = '<div class="row3"><button class="kpi" data-act="nav" data-v="cases"><b>' + state.cases.length + '</b><div>' + S('held') + '</div></button><button class="kpi" data-act="casesTab" data-t="out" style="' + (out ? 'background:var(--redt)' : '') + '"><b style="color:' + (out ? 'var(--red)' : 'var(--ink)') + '">' + out + '</b><div>' + S('outTat') + '</div></button><button class="kpi" data-act="casesTab" data-t="due"><b style="color:' + (due ? 'var(--amb)' : 'var(--ink)') + '">' + due + '</b><div>' + S('dueToday') + '</div></button></div>';
  var minis = state.cases.slice(0, 4).map(function (c) { return '<button class="mini" data-act="open" data-c="' + esc(c.claim) + '"><b>' + esc(c.insured || '—') + '</b>' + tatChip(c) + '<span class="sub">' + esc(c.claim) + '</span><span class="small" style="text-align:right;color:' + (c.promise && c.promise.state !== 'later' ? 'var(--red);font-weight:700' : 'var(--mut)') + '">' + esc(isNew(c) ? 'NEW' : c.promise && c.promise.state !== 'later' ? 'Promised today' : c.promise ? 'On ' + c.promise.dueDay.slice(8, 10) + '-' + c.promise.dueDay.slice(5, 7) : (c.tp ? c.tp.done + '/' + c.tp.total + ' TP' : '')) + '</span></button>'; }).join('');

    (d.updatesOpen && !d.dayClosed && d.held ? '<button class="banner b-amb" style="border:0;text-align:left" data-act="nav" data-v="today">' + ic('schedule') + '<span><b>' + S('updBefore') + '</b><span class="d">' + (d.updatesDone || 0) + ' of ' + d.held + ' saved</span></span></button>' : '') +
    nx + kpis + '<div class="row"><b style="font-size:15px">' + S('myCases') + '</b><button style="margin-left:auto;font-size:13px;color:var(--link);font-weight:600;border:0;background:none" data-act="nav" data-v="cases">' + S('seeAll') + ' ' + state.cases.length + '</button></div>' +
    (minis || '<div class="empty">' + ic('inbox') + S('noCases') + '</div>') + '</div>';
  return scr(head(S('home'), (state.me ? state.me.name : '') + (state.me && state.me.empId ? ' · ' + state.me.empId : '')), body, '', 'home');
}

/* ═══ MY CASES — filter chips, the out-of-TAT block, the case cards ═════════════════════════ */
function caseLine(c) {
  var a = c.app, e = c.events || {};
  if (isNew(c)) return ['var(--blue)', 'Assigned · accept in ' + mmss((a.acceptBy || 0) - Date.now())];
  if (c.report && c.report.status === 'returned') return ['var(--redb)', 'Report sent back'];
  if (c.report && (c.report.status === 'submitted' || c.report.status === 'accepted')) return ['var(--okb)', 'FO Completed'];
  if (c.product === 'Health' && e.started && !e.reached) return ['#F0A500', 'Started · reach within 24 h'];
  if (e.started || e.reached) return ['var(--redb)', 'In progress'];
  if (accepted(c)) return ['var(--okb)', 'Accepted · start the case'];
  return ['var(--mut)', c.status || 'Assigned'];
}
function vCases() {
  var tab = state.ctab || 'all', q = (state.q || '').trim().toLowerCase();
  var list = state.cases.filter(function (c) {
    if (tab === 'new' && !isNew(c)) return false;
    if (tab === 'out' && !c.outTat) return false;
    if (tab === 'due' && !(c.tatLeftH != null && c.tatLeftH >= 0 && c.tatLeftH < 24)) return false;
    if (tab === 'health' && c.product !== 'Health') return false;
    if (tab === 'motor' && c.product !== 'TP') return false;
    return !q || [c.claim, c.insured, c.hospital, c.client, c.insuredCity, c.hospitalCity].join(' ').toLowerCase().indexOf(q) >= 0;
  });
  var out = state.cases.filter(function (c) { return c.outTat; });
  var cnt = function (f) { return state.cases.filter(f).length; };
  var chips = [['all', S('all') + ' ' + state.cases.length], ['new', S('newc') + ' ' + cnt(isNew)], ['out', S('outTat') + ' ' + out.length], ['health', S('health')], ['motor', S('motor')]];
  var body = '<div class="pad">' + (out.length ? '<div class="banner b-red">' + ic('block') + '<span><b>' + out.length + ' case' + (out.length > 1 ? 's' : '') + ' out of TAT</b>' + S('outBanner') + '</span></div>' : '') +
    '<div class="row small mut">' + ic('sync') + S('synced') + ' · ' + (state.syncedAt ? tm(state.syncedAt) : '…') + '<span style="margin-left:auto">' + state.cases.length + ' cases</span></div>' +
    '<div class="ifld" style="height:44px">' + ic('search') + '<input id="fQ" placeholder="' + S('search') + '" value="' + esc(state.q || '') + '"></div>' +
    '<div class="chips">' + chips.map(function (t) { return '<button data-act="ctab" data-t="' + t[0] + '" class="' + (tab === t[0] ? 'on' : '') + '">' + esc(t[1]) + '</button>'; }).join('') + '</div>' +
    (list.length ? list.map(function (c) {
      var ln = caseLine(c);
      return '<button class="ccard ' + (isNew(c) ? 'new' : c.outTat ? 'out' : '') + '" data-act="open" data-c="' + esc(c.claim) + '"><div class="row" style="flex-wrap:wrap">' + (isNew(c) ? '<span class="tag" style="background:var(--blue);color:#fff">NEW</span>' : '') + prodChip(c) + '<span style="margin-left:auto">' + tatChip(c) + '</span></div>' +
        '<div class="nm">' + esc(c.insured || '—') + '</div><div class="sub">' + esc(c.claim) + ' · ' + esc(c.client) + '</div>' +
        (place(c) ? '<div class="row small" style="color:var(--body)">' + ic('location_on') + '<span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(place(c)) + '</span></div>' : '') +
        '<div class="row"><span class="dotl"><i class="d" style="background:' + ln[0] + '"></i>' + esc(ln[1]) + '</span><span class="small mut" style="margin-left:auto">' + (c.tp ? c.tp.done + ' of ' + c.tp.total : '') + '</span>' + chCardBadge(c.claim) + '</div></button>';
    }).join('') : '<div class="empty">' + ic('inbox') + S('noCases') + '</div>') + '</div>';

}

/* ═══ CASE WORKSPACE — the timer, the case, what reached the portal, the tools, the next step ═══ */
function curCase() { return state.cases.filter(function (x) { return x.claim === state.open; })[0] || null; }
function timerBanner(c) {
  var e = c.events || {}, now = Date.now();
  if (c.cashless && c.cashlessDue && !(c.report && (c.report.status === 'submitted' || c.report.status === 'accepted'))) {
    var l = c.cashlessDue - now;
    if (l <= 0) return '<div class="banner b-red">' + ic('timer_off') + '<span><b>Cashless late</b><span class="d">Not completed within 20 hours of creation. Your manager has been told.</span></span></div>';
    return '<div class="banner ' + (l < 2 * 3600000 ? 'b-red' : 'b-amb') + '">' + ic('timer') + '<span style="flex:1"><b>Cashless · complete in <span class="mono" data-count="' + c.cashlessDue + '">' + hhmmss(l) + '</span></b><span class="d">Cashless cases must be completed within 20 hours of creation. Alerts at 2 h and 1 h left.</span></span></div>';
  }
  if (c.reachBy) {
    var r = c.reachBy - now, from = (e.started ? e.started.at : (c.app && c.app.acceptedAt)) || now, pct = Math.min(100, Math.max(0, (now - from) / (c.reachBy - from) * 100));
    if (r <= 0) return '<div class="banner b-red">' + ic('move_up') + '<span><b>Case moving</b><span class="d">24 hours passed without "I have reached". Your manager re-allocates it.</span></span></div>';
    var warn = r < 16 * 3600000;
    return '<div class="banner ' + (warn ? 'b-amb' : 'b-sky') + '" style="flex-direction:column;gap:6px"><div class="row">' + ic(warn ? 'warning' : 'timer') + '<b style="flex:1">' + (warn ? Math.ceil(r / 3600000) + ' hours left or this case moves' : 'Reach the hospital') + '</b><b class="mono" data-count="' + c.reachBy + '">' + hhmmss(r) + '</b></div>' +
      '<span class="d">Tap "I have reached" at the hospital and take the GPS photo. After 24 hours the case moves to another officer by itself.</span><div class="bar"><i style="width:' + pct.toFixed(0) + '%;background:' + (warn ? '#F0A500' : 'var(--blue)') + '"></i></div></div>';
  }
  if (c.startBy) {
    var s = c.startBy - now;
    if (s <= 0) return '<div class="banner b-red">' + ic('currency_rupee') + '<span><b>₹50 added · not started in 3 days</b><span class="d">The case stays with you. Start it now. Appeal from Profile → Fine Amount.</span></span></div>';
    if (s < 86400000) return '<div class="banner b-red">' + ic('alarm') + '<span><b>Last day to start · today</b><span class="d">Start this case today. If not, ₹50 is added and your rating goes down. The case stays with you.</span></span></div>';
    return '<div class="banner b-sky">' + ic('timer') + '<span><b>Motor TP · start within 3 days</b><span class="d">' + Math.ceil(s / 86400000) + ' day(s) left to start.</span></span></div>';
  }
  return '';
}
function vCase() {
  var c = curCase();

  var e = c.events || {}, rep = c.report || null;
  var info = '<div class="card big" style="display:flex;flex-direction:column;gap:8px"><div class="row">' + prodChip(c) + '<span style="margin-left:auto">' + tatChip(c) + '</span></div><b style="font-size:19px">' + esc(c.insured || '—') + '</b><div class="sub">' + esc(c.claim) + '</div>' +
    '<div class="kv"><span>Insurer</span><div>' + esc(c.client) + '</div>' + (c.subProduct ? '<span>Product</span><div>' + esc(c.subProduct) + '</div>' : '') + (place(c) ? '<span>Location</span><div>' + esc(place(c)) + '</div>' : '') +
    (c.hospital ? '<span>Hospital</span><div>' + esc(c.hospital) + '</div>' : '') + (c.policeStation ? '<span>Police</span><div>' + esc(c.policeStation) + '</div>' : '') +

  var st = function (done, icn, t, s, at) { return '<div class="st">' + ic(done ? 'check_circle' : icn, done ? 'fill' : '') .replace('<i class="ic', '<i style="color:' + (done ? 'var(--okb)' : 'var(--mut)') + '" class="ic') + '<div><b>' + t + '</b>' + (s ? '<small>' + s + '</small>' : '') + '</div><small>' + (at ? tm(at) : '–') + '</small></div>'; };
  var tl = '<div class="card big"><div class="row" style="margin-bottom:4px"><b style="font-size:15px">' + S('sentPortal') + '</b><span class="small" style="margin-left:auto;color:var(--ok)">' + ic('cloud_done') + ' live</span></div><div class="tl">' +
    st(true, 'send', 'Assigned on taasenclaims.com', esc(c.manager || ''), c.app ? c.app.assignedAt : null) +
    st(accepted(c), 'radio_button_unchecked', 'Accepted in app', 'Portal status → FO Accepted', c.app && c.app.acceptedAt) +
    st(!!e.started, 'radio_button_unchecked', 'Started', c.product === 'TP' ? 'Motor TP · start within 3 days' : '', e.started && e.started.at) +
    (c.product === 'Health' ? st(!!e.reached, 'radio_button_unchecked', 'Reached · GPS photo', 'Stamp with map, lat/long, time', e.reached && e.reached.at) : '') +
    st(c.tp && c.tp.total && c.tp.done >= c.tp.total, 'pending', 'Touch points', (c.tp ? c.tp.done + ' of ' + c.tp.total + ' done' : ''), null) +
    st(rep && (rep.status === 'submitted' || rep.status === 'accepted'), 'radio_button_unchecked', 'Final report submitted', 'Status → FO Completed', null) + '</div></div>';
  var tools = '<div class="row"><b style="font-size:15px">' + ic('grid_view') + ' ' + S('tools') + '</b></div><div class="tools">' +
    [['description', S('details'), 'View complete case information', 'details'], ['location_on', S('tpT'), 'Photos, remarks, done', 'tps'], ['schedule', S('timeline'), 'Case activity timeline', 'timeline'], ['account_balance_wallet', S('expenses'), 'Track case expenses', 'caseExp'], ['forum', 'Team Chat', 'Your manager and team · @tag', 'chatOpen']]
      .map(function (t) { return '<button class="tool" data-act="' + t[3] + '" data-c="' + esc(c.claim) + '"><span class="cir">' + ic(t[0]) + '</span><b>' + t[1] + '</b><small>' + t[2] + '</small></button>'; }).join('') + '</div>';
  var returned = rep && rep.status === 'returned' ? '<div class="banner b-red">' + ic('undo') + '<span><b>' + S('rpBackT') + '</b><span class="d">' + esc(rep.note || '') + '</span></span></div>' : '';

  if (canAnswer(c)) foot = '<button class="btn rej" style="flex:1" data-act="reject" data-id="' + (c.app && !c.app.closedAt ? c.app.id : '') + '" data-c="' + esc(c.claim) + '">' + S('reject') + '</button><button class="btn green" style="flex:2" data-act="accept" data-id="' + (c.app && !c.app.closedAt ? c.app.id : '') + '" data-c="' + esc(c.claim) + '">' + ic('check_circle') + 'Accept case</button>';
  else if (rep && (rep.status === 'submitted' || rep.status === 'accepted')) foot = '<button class="btn soft" data-act="rpOpen" data-c="' + esc(c.claim) + '">' + ic('task_alt') + 'FO Completed · view report</button>';
  else if (!e.started) foot = '<button class="btn ' + (c.startBy && c.startBy - Date.now() < 86400000 ? 'redb' : 'grad') + '" data-act="caseStart" data-c="' + esc(c.claim) + '">' + ic('play_arrow') + S('startNow') + '</button>';
  else if (c.product === 'Health' && !e.reached) foot = '<button class="btn green" data-act="caseReached" data-c="' + esc(c.claim) + '">' + ic('where_to_vote') + S('reached') + '</button>';
  else if (c.tp && c.tp.done < c.tp.total) foot = '<button class="btn grad" data-act="tps" data-c="' + esc(c.claim) + '">' + ic('play_arrow') + S('startTp') + '</button>';
  else foot = '<button class="btn green" data-act="rpOpen" data-c="' + esc(c.claim) + '">' + ic('task_alt') + (rep && rep.status === 'saved' ? S('complete') : S('frBtn')) + '</button>';
  var body = '<div class="pad">' + returned + promiseBanner(c.promise) + timerBanner(c) + info + tl + tools + '</div>';
  return scr(head(S('ws'), c.claim, { back: 'backCases', noBell: true, right: chIcon(c.claim) }), body, foot);
}

/* ═══ TOUCH POINTS — mine, with the GPS-stamped photo checklist ═══════════════════════════ */

  var nextI = t.tps.findIndex(function (x) { return x.status !== 'done' && x.status !== 'rejected'; });
  var body = '<div class="pad"><div class="card big"><div class="row">' + prodChip(c) + '<span class="small mut">' + esc(c.client) + '</span><span style="margin-left:auto">' + tatChip(c) + '</span></div><b style="font-size:17px;display:block;margin-top:6px">' + esc(c.insured || '—') + '</b><div class="sub">' + esc(c.claim) + '</div></div>' +

function afterUnlock() {

    var d = state.day || {};
    if (d.ok === false || !d.day) { goHome(); return; }
    if (d.missedYesterday && d.missedYesterday.length && !d.punched) { state.view = 'today'; render(); loadToday(d.missedDay); return; }
    if (!d.punched && d.punchOpen) { state.view = 'punch'; state.punch = {}; render(); getPos().then(function () { if (state.view === 'punch') render(); }); return; }
    if (d.punched && !d.committed && d.held) { openCommit(); return; }

function pinKey(k) {
  state.err = '';
  if (k === '⌫') { state.pin = state.pin.slice(0, -1); render(); return; }
  if (state.pin.length >= 4) return;
  state.pin += k; render();
  if (state.pin.length < 4) return;
  var p = state.pin;
  if (state.pinMode === 'set1') { state.pin1 = p; state.pin = ''; state.pinMode = 'set2'; render(); return; }
  if (state.pinMode === 'set2') {
    if (p !== state.pin1) { state.pin = ''; state.pin1 = ''; state.pinMode = 'set1'; state.err = S('nomatch'); render(); return; }
    sha(p).then(function (h) { store.set('pinHash', h); store.set('unlocked', today()); state.pin = ''; afterUnlock(); if (!alarmReady()) enablePush(); });

/* ═══ v34.9 · SOS (Sujit, 27-Sep: "give the SOS option … once they click, their team lead — OHS — and SH

var SOS_REASONS = ['Accident', 'Medical emergency', 'Threat / unsafe', 'Vehicle breakdown', 'Other'];

function sosToldWords(s) { var t = (s.told || []).map(function (x) { return x.name + ' (' + x.role + ')'; }); t.push('Admin'); return t.join(', '); }
function loadSos() { return api('/api/app/sos').then(function (j) { if (j && j.ok) { var was = JSON.stringify(state.sos || null); state.sos = j.sos; if (was !== JSON.stringify(j.sos || null) && ['home', 'profile'].indexOf(state.view) >= 0) render(); } }); }

  sheetOpen('<div style="text-align:center"><span style="width:64px;height:64px;border-radius:32px;background:var(--redt);color:var(--redb);display:grid;place-items:center;margin:0 auto 6px">' + ic('sos').replace('class="ic', 'style="font-size:38px" class="ic') + '</span><b style="font-size:20px;color:var(--red)">Send SOS</b>' +
    '<div class="small mut" style="margin:4px 0 12px">Your location goes to your OHS, your State Coordinator and the admin at once.</div></div>' +
    SOS_REASONS.map(function (r) { return '<button class="opt' + (why === r ? ' on' : '') + '" data-why="' + esc(r) + '">' + ic(why === r ? 'radio_button_checked' : 'radio_button_unchecked') + esc(r) + '</button>'; }).join('') +
    '<input class="inp" id="sosNote" maxlength="300" placeholder="What happened? (optional)" value="' + esc(state.sosNote || '') + '" style="margin-bottom:10px">' +

    var w = e.target.closest('[data-why]'); if (w) { state.sosNote = ($('sosNote') || {}).value || ''; state.sosWhy = w.dataset.why; sosOpen(); return; }

  if (!store.get('token')) { state.view = 'login'; render(); return; }

    if (!j.ok) { if (!store.get('token')) return; state.me = state.me || { name: '' }; }

      loadSos();

    }

    if (CAP) wireNative();
    else if ('serviceWorker' in navigator) navigator.serviceWorker.register('/pinaka/sw.js', { scope: '/pinaka/' }).catch(function () {});
    if (!store.get('pinHash')) { state.view = 'pin'; state.pinMode = 'set1'; render(); }
    else if (store.get('unlocked') !== today()) { state.view = 'pin'; state.pinMode = 'unlock'; render(); }
    else afterUnlock();
  });
  /* a second chance for the alarm while the app is open: ask every 20 seconds */
  setInterval(function () { if (store.get('token') && document.visibilityState === 'visible' && ['home', 'cases', 'case', 'profile', 'today'].indexOf(state.view) >= 0) loadAlarms(false); }, 20000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && store.get('token') && state.view !== 'pin' && state.view !== 'login') { loadAlarms(true); loadCases(); } });

  var chatQ = function (u) { try { var q = new URL(u, location.href).searchParams; if (q.get('chat')) return { claim: q.get('chat'), msg: Number(q.get('msg')) || null }; } catch (e) { } return null; };

})();
