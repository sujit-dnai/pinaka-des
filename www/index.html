<html lang="en">

<meta name="mobile-web-app-capable" content="yes">

<title>Pinaka</title>

<style>
/* Pinaka · TaaSen field officer app · v34.8
   One file for both homes: taasenclaims.com/pinaka (installable web app) and the store
   builds (Android / iPhone, Capacitor www/index.html). Colour tokens are the design's. */
:root{
  --navy:#001F3F;--blue:#0074D9;--sky:#E8F2FC;
  --bg:#F2F5F9;--card:#FFFFFF;--ink:#0B1B2B;--body:#33475B;--mut:#6B7C8F;--line:#E1E8F0;--link:#0060B5;
  --ok:#0F8A4B;--okt:#0B6B3A;--okb:#E3F5EA;--red:#D0342C;--redt:#A5231C;--redb:#FDE8E7;--amb:#B86E00;--ambt:#8A5200;--ambb:#FFF3DC;
  --r:14px;--sh:0 2px 10px rgba(0,31,63,.07);
  --f1:12px;--f2:14px;--f3:16px;--f4:20px;--f5:28px;--f6:44px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08121D;--card:#0F1D2C;--ink:#EAF1F8;--body:#C3D0DD;--mut:#8497AA;--line:#1D3043;--link:#6CB4FF;--sky:#10263D;
    --okb:#0E2A1C;--ok:#3CCB7F;--okt:#7FE0AA;--redb:#34110F;--red:#FF6B61;--redt:#FFA39C;--ambb:#2E2108;--amb:#F2A93B;--ambt:#F7C878;
    --sh:0 2px 10px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#08121D;--card:#0F1D2C;--ink:#EAF1F8;--body:#C3D0DD;--mut:#8497AA;--line:#1D3043;--link:#6CB4FF;--sky:#10263D;
  --okb:#0E2A1C;--ok:#3CCB7F;--okt:#7FE0AA;--redb:#34110F;--red:#FF6B61;--redt:#FFA39C;--ambb:#2E2108;--amb:#F2A93B;--ambt:#F7C878;
  --sh:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--body);font:400 var(--f2)/1.45 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:'liga';vertical-align:middle}
.noicons .ms{display:none}
.fb{display:none}.noicons .fb{display:inline}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:calc(env(safe-area-inset-top) + 12px) var(--s4) var(--s4);position:sticky;top:0;z-index:5}
.toprow{display:flex;align-items:center;gap:var(--s3)}
.toprow img{width:34px;height:34px;border-radius:9px;background:#fff1}
.toprow .t{flex:1;min-width:0}
.toprow .t b{display:block;font-size:var(--f3);font-weight:600;color:#fff}
.toprow .t small{display:block;color:#CFE4FA;font-size:var(--f1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid #ffffff55;background:#ffffff1a;color:#fff;border-radius:999px;padding:5px 10px;font-size:var(--f1);font-weight:600;min-height:32px;display:inline-flex;align-items:center;gap:4px}
.iconbtn{background:#ffffff1a;border:0;color:#fff;border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
main{flex:1;padding:var(--s4);padding-bottom:calc(var(--s6) + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:var(--s4);margin-bottom:var(--s3)}
h1{font-size:var(--f5);color:var(--ink);margin:var(--s2) 0 var(--s2);font-weight:700;line-height:1.2}
h2{font-size:var(--f3);color:var(--ink);margin:0 0 var(--s2);font-weight:600}
.mut{color:var(--mut)}
.lbl{font-size:var(--f1);color:var(--mut);font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin:var(--s4) 0 var(--s2)}
input.in{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:14px;font-size:var(--f3);color:var(--ink);outline:none}
input.in:focus{border-color:var(--blue)}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;font-weight:600;font-size:var(--f3);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.p{background:var(--blue);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.no{background:var(--card);color:var(--red);border:1.5px solid var(--red)}
.btn.g{background:var(--sky);color:var(--link)}
.btn:disabled{opacity:.55}
.err{background:var(--redb);color:var(--redt);border-radius:10px;padding:10px 12px;margin:var(--s3) 0;font-size:var(--f2)}
.note{background:var(--ambb);color:var(--ambt);border-radius:10px;padding:10px 12px;margin:0 0 var(--s3);font-size:var(--f2);display:flex;gap:8px}
.good{background:var(--okb);color:var(--okt);border-radius:10px;padding:10px 12px;margin:0 0 var(--s3);font-size:var(--f2);display:flex;gap:8px}
.pinrow{display:flex;gap:10px;justify-content:center;margin:var(--s5) 0}
.pinrow i{width:16px;height:16px;border-radius:50%;border:2px solid var(--blue);display:block}
.pinrow i.f{background:var(--blue)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.pad button{min-height:62px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:var(--f4);font-weight:600;color:var(--ink)}
.tabs{display:flex;gap:8px;margin:0 0 var(--s3);overflow-x:auto}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;color:var(--body);white-space:nowrap;min-height:40px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.case{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:var(--s3) var(--s4);margin-bottom:10px;box-shadow:var(--sh)}
.case .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.case .cl{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--ink);font-size:var(--f2)}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap}
.pill.b{background:var(--sky);color:var(--link)}
.pill.g{background:var(--okb);color:var(--okt)}
.pill.r{background:var(--redb);color:var(--redt)}
.pill.a{background:var(--ambb);color:var(--ambt)}
.case .nm{color:var(--ink);font-weight:600;margin-top:4px}
.case .mt{color:var(--mut);font-size:var(--f1);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:var(--f2)}
.kv dt{color:var(--mut)}
.kv dd{margin:0;color:var(--ink);word-break:break-word}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;padding:var(--s6) var(--s4);color:var(--mut)}
.empty .ms{font-size:44px;color:var(--blue);display:block;margin:0 auto var(--s2)}
/* the alarm */
#alarm{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#001F3F 0%,#003B73 55%,#0074D9 100%);color:#fff;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px)}
#alarm.on{display:flex}
#alarm .ring{width:120px;height:120px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center;margin:28px auto 16px;animation:pulse 1.1s infinite}
#alarm .ring .ms{font-size:64px;color:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ffffff66}70%{box-shadow:0 0 0 28px #ffffff00}100%{box-shadow:0 0 0 0 #ffffff00}}
#alarm .big{font-size:var(--f1);letter-spacing:.12em;text-transform:uppercase;color:#CFE4FA;text-align:center}
#alarm .claim{font-family:'IBM Plex Mono',monospace;font-size:26px;text-align:center;margin:6px 0 4px;word-break:break-all}
#alarm .sub{text-align:center;color:#DCEBFA;font-size:var(--f2)}
#alarm .count{font-family:'IBM Plex Mono',monospace;font-size:var(--f6);text-align:center;margin:18px 0 4px}
#alarm .count.late{color:#FFB4AE}
#alarm .acts{margin-top:auto;display:grid;gap:12px}
#alarm .acts .btn.no{background:transparent;color:#fff;border-color:#ffffffaa}
#alarm .more{text-align:center;color:#CFE4FA;font-size:var(--f1);margin-top:8px}
.sheet{position:fixed;inset:0;z-index:60;background:#0008;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in2{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:var(--s5) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom))}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px;min-height:48px;color:var(--ink)}
.opt.on{border-color:var(--blue);background:var(--sky)}
textarea.in{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:14px;font-weight:600;z-index:80;display:none;max-width:90vw;text-align:center}
.toast.on{display:block}
.hero{text-align:center;padding:var(--s5) 0 var(--s3)}
.hero img{width:96px;height:96px;border-radius:24px;box-shadow:var(--sh)}
.steps{margin:0;padding-left:20px}
.steps li{margin-bottom:6px}
a{color:var(--link)}
</style>
</head>

      '<div class="count' + (left < 0 ? ' late' : '') + '">' + mmss(left) + '</div>' +
      '<div class="sub">' + (left < 0 ? S('late') : S('left')) + '</div>' +
      '<div class="acts"><button class="btn ok" data-act="accept" data-id="' + a.id + '"><span class="ms">check_circle</span>' + S('accept') + '</button>' +
      '<button class="btn no" data-act="reject" data-id="' + a.id + '"><span class="ms">cancel</span>' + S('reject') + '</button>' +
      '<div class="more">' + (state.alarms.length > 1 ? (state.alarms.length - 1) + ' ' + S('oneMore') + ' · ' : '') + S('tapStop') + '</div></div>';
  }
  paint();
  el.className = 'on';
  clearInterval(alarmTick); alarmTick = setInterval(paint, 1000);
  if (!sound.timer && !showAlarm.muted) soundStart();
  if (!a.seenAt) { a.seenAt = Date.now(); api('/api/app/seen', { method: 'POST', body: { id: a.id } }); }
}
function hideAlarm() { $('alarm').className = ''; clearInterval(alarmTick); soundStop(); }

/* ═══ reject sheet ═══════════════════════════════════════════════════════════════════ */
var REASONS = ['Too far / not my area', 'Already have too many cases', 'On leave / unwell', 'Wrong allocation', 'Other'];
function openReject(id) {
  soundStop(); showAlarm.muted = true;
  var pick = '';
  var el = $('sheetIn');
  function paint() {
    el.innerHTML = '<h2>' + S('why') + '</h2>' + REASONS.map(function (r) { return '<button class="opt' + (pick === r ? ' on' : '') + '" data-r="' + esc(r) + '"><span class="ms">' + (pick === r ? 'radio_button_checked' : 'radio_button_unchecked') + '</span>' + esc(r) + '</button>'; }).join('') +
      '<textarea class="in" id="rDet" maxlength="300" placeholder="Details (optional)"></textarea><div style="height:12px"></div>' +
      '<div class="row2"><button class="btn g" data-x="cancel">' + S('cancel') + '</button><button class="btn no" data-x="send"' + (pick ? '' : ' disabled') + '>' + S('send') + '</button></div>';
  }
  paint();
  $('sheet').className = 'sheet on';
  el.onclick = function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.r) { var det = ($('rDet') || {}).value || ''; pick = b.dataset.r; paint(); $('rDet').value = det; return; }
    if (b.dataset.x === 'cancel') { $('sheet').className = 'sheet'; return; }
    if (b.dataset.x === 'send') {
      b.disabled = true;
      api('/api/app/reject', { method: 'POST', body: { id: Number(id), reason: pick, details: ($('rDet') || {}).value || '' } }).then(function (j) {
        $('sheet').className = 'sheet';
        if (j.ok) { toast(S('rejOk')); afterAnswer(id); } else toast(j.error || 'Could not send');
      });
    }
  };
}
function afterAnswer(id) {
  state.alarms = state.alarms.filter(function (a) { return String(a.id) !== String(id); });
  showAlarm.muted = false;
  if (state.alarms.length) showAlarm(); else hideAlarm();
  loadCases();
}

/* ═══ push: the store app (Firebase) or the installed web app (Web Push) ═══════════════ */
function isStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function alarmReady() {
  if (CAP) return store.get('pushOk') === '1';
  return ('Notification' in window) && Notification.permission === 'granted' && store.get('pushOk') === '1';
}
function b64uToU8(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function enablePush() {
  if (CAP) return enableNativePush();
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { toast(/iphone|ipad/i.test(navigator.userAgent) && !isStandalone() ? 'iPhone: first Add to Home Screen, then open Pinaka from the icon.' : 'This browser cannot ring. Use Chrome on Android.'); return Promise.resolve(); }
  return Notification.requestPermission().then(function (perm) {
    if (perm !== 'granted') { toast('Notifications are blocked. Allow them in the phone settings for this app.'); return; }
    return navigator.serviceWorker.register('/pinaka/sw.js', { scope: '/pinaka/' }).then(function () { return navigator.serviceWorker.ready; }).then(function (reg) {
      return api('/api/app/me').then(function (me) {
        if (!me.pushKey) { toast('The portal has no push key switched on yet.'); return; }
        return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToU8(me.pushKey) }).then(function (sub) {
          return api('/api/app/push', { method: 'POST', body: sub.toJSON() }).then(function (j) { if (j.ok) { store.set('pushOk', '1'); toast(S('alarmOn')); render(); } else toast(j.error || 'Could not switch on'); });
        });
      });
    });
  }).catch(function (e) { toast('Could not switch on: ' + (e && e.message ? e.message : e)); });
}
function nativePlugins() { return (window.Capacitor && window.Capacitor.Plugins) || {}; }
/* The store app: Firebase Cloud Messaging on both Android and iPhone (@capacitor-firebase/messaging),
   so the portal sends ONE kind of push. Android gets its own "pinaka_alarm" channel with the alarm
   sound at max importance, so the ring sounds with the app closed. */
function enableNativePush() {
  var FM = nativePlugins().FirebaseMessaging;
  if (!FM) { toast('Push plugin missing in this build.'); return Promise.resolve(); }
  var chan = (PLATFORM === 'android' && FM.createChannel) ? FM.createChannel({ id: 'pinaka_alarm', name: 'New case alarm', description: 'Rings when a case is given to you', importance: 5, visibility: 1, sound: 'pinaka_alarm', vibration: true, lights: true, lightColor: '#0074D9' }).catch(function () {}) : Promise.resolve();
  return chan.then(function () { return FM.requestPermissions(); }).then(function (r) {
    if (!r || r.receive !== 'granted') { toast('Notifications are blocked. Allow them in Settings → Apps → Pinaka.'); return; }
    return FM.getToken().then(function (t) { return sendNativeToken(t && t.token); });
  }).catch(function (e) { toast('Could not switch on: ' + (e && e.message ? e.message : e)); });
}
function sendNativeToken(tok) {
  if (!tok) return;
  return api('/api/app/push', { method: 'POST', body: { fcmToken: tok, platform: PLATFORM } }).then(function (j) {
    if (j.ok) { store.set('pushOk', '1'); render(); } else toast(j.error || 'Could not switch on the alarm');
  });
}
function wireNative() {
  var FM = nativePlugins().FirebaseMessaging;
  if (!FM || wireNative.done) return;
  wireNative.done = true;
  FM.addListener('tokenReceived', function (e) { if (store.get('pushOk') === '1') sendNativeToken(e && e.token); });
  FM.addListener('notificationReceived', function () { loadAlarms(true); });
  FM.addListener('notificationActionPerformed', function () { loadAlarms(true); });
  var App = nativePlugins().App;
  if (App && App.addListener) App.addListener('appStateChange', function (s) { if (s.isActive && store.get('token')) { loadAlarms(true); loadCases(); } });
  if (store.get('pushOk') === '1') enableNativePush();
}

/* ═══ data ═══════════════════════════════════════════════════════════════════════════ */
function loadAlarms(ring) {
  return api('/api/app/alarm').then(function (j) {
    if (!j.ok) return;
    var before = state.alarms.map(function (a) { return a.id; }).join(',');
    state.alarms = j.alarms || [];
    var fresh = state.alarms.some(function (a) { return before.split(',').indexOf(String(a.id)) < 0; });
    if (state.alarms.length && (ring || fresh) && state.view !== 'pin') { showAlarm.muted = false; showAlarm(); }
    if (!state.alarms.length) hideAlarm();
    if (state.view === 'home') render();
  });
}
function loadCases() {
  return api('/api/app/cases').then(function (j) {
    if (!j.ok) { if (!j.signedOut) toast(j.error || 'Could not load cases'); return; }
    state.cases = j.cases || []; state.skdQuiet = !!j.skdQuiet;
    if (state.view === 'home' || state.view === 'case') render();
  });
}

/* ═══ render + events ════════════════════════════════════════════════════════════════ */
function render() {
  applyTheme();
  var v = state.view, html = '';
  if (v === 'boot') html = head('Pinaka', '') + '<main><div class="empty"><span class="ms">hourglass_top</span></div></main>';
  else if (v === 'activate') html = vActivate();
  else if (v === 'pin') html = vPin(state.pinMode);
  else if (v === 'home') html = vHome();
  else if (v === 'case') html = vCase();
  else if (v === 'profile') html = vProfile();
  $('app').innerHTML = html;
  var q = $('fQ'); if (q) q.oninput = function () { state.q = q.value; var pos = q.selectionStart; render(); var q2 = $('fQ'); q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) {} };
}
function goHome() { state.view = 'home'; render(); loadCases(); loadAlarms(false); }
function pinKey(k) {
  state.err = '';
  if (k === '⌫') { state.pin = state.pin.slice(0, -1); render(); return; }
  if (state.pin.length >= 4) return;
  state.pin += k; render();
  if (state.pin.length < 4) return;
  var p = state.pin;
  (function () {
    if (state.pinMode === 'set1') { state.pin1 = p; state.pin = ''; state.pinMode = 'set2'; render(); return; }
    if (state.pinMode === 'set2') {
      if (p !== state.pin1) { state.pin = ''; state.pin1 = ''; state.pinMode = 'set1'; state.err = S('nomatch'); render(); return; }
      sha(p).then(function (h) { store.set('pinHash', h); store.set('unlocked', today()); state.pin = ''; goHome(); if (!alarmReady()) enablePush(); });
      return;
    }
    sha(p).then(function (h) {
      if (h === store.get('pinHash')) { store.set('unlocked', today()); state.pin = ''; goHome(); }
      else { state.pin = ''; state.err = S('wrongpin'); render(); }
    });
  })();
}
document.addEventListener('click', function (ev) {
  if (ev.target.closest('#alarm') && !ev.target.closest('button')) { soundStop(); showAlarm.muted = true; return; }
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var act = b.dataset.act;
  if (act === 'key') return pinKey(b.dataset.k);
  if (act === 'activate') {
    var id = $('fId').value.trim(), code = $('fCode').value.replace(/\D/g, '');
    state.err = ''; state.busy = true; render(); $('fId').value = id; $('fCode').value = code;
    api('/api/app/activate', { method: 'POST', body: { id: id, code: code, platform: PLATFORM } }).then(function (j) {
      state.busy = false;
      if (!j.ok) { state.err = j.error || 'Could not sign in'; render(); $('fId').value = id; return; }
      store.set('token', j.token); idbPut(j.token); store.set('lastId', id); store.set('pushOk', null);
      state.me = j.officer; state.view = 'pin'; state.pinMode = 'set1'; state.pin = ''; render();
    });
    return;
  }
  if (act === 'tab') { state.tab = b.dataset.t; render(); return; }
  if (act === 'refresh') { loadCases(); loadAlarms(false); toast(S('refresh') + '…'); return; }
  if (act === 'open') { state.open = b.dataset.c; state.view = 'case'; render(); window.scrollTo(0, 0); return; }
  if (act === 'home') { state.view = 'home'; render(); return; }
  if (act === 'profile') { state.view = 'profile'; render(); return; }
  if (act === 'enablePush') { enablePush(); return; }
  if (act === 'showAlarm') { showAlarm.muted = false; showAlarm(); return; }
  if (act === 'testSound') { soundStart(); setTimeout(soundStop, 4000); return; }
  if (act === 'setLang') { store.set('lang', b.dataset.l); render(); return; }
  if (act === 'setTheme') { store.set('theme', b.dataset.v || null); render(); return; }
  if (act === 'lang') { var i = LANGS.map(function (l) { return l[0]; }).indexOf(store.get('lang') || 'en'); store.set('lang', LANGS[(i + 1) % LANGS.length][0]); render(); if ($('alarm').className === 'on') showAlarm(); return; }
  if (act === 'accept') {
    b.disabled = true;
    api('/api/app/accept', { method: 'POST', body: { id: Number(b.dataset.id) } }).then(function (j) {
      if (j.ok) { toast(S('accOk')); afterAnswer(b.dataset.id); } else { b.disabled = false; toast(j.error || 'Could not accept'); }
    });
    return;
  }
  if (act === 'reject') { openReject(b.dataset.id); return; }
});

/* ═══ start ═══════════════════════════════════════════════════════════════════════════ */
(function boot() {
  applyTheme();
  /* no icon font (no data yet, or blocked): hide the icon words instead of printing them */
  try { if (document.fonts && document.fonts.load) document.fonts.load('24px "Material Symbols Rounded"').then(function (f) { if (!f || !f.length) document.documentElement.classList.add('noicons'); }).catch(function () { document.documentElement.classList.add('noicons'); }); } catch (e) {}
  if (!ON_PORTAL && !CAP) { API = PORTAL; }
  if (!store.get('token')) { state.view = 'activate'; render(); return; }
  idbPut(store.get('token'));
  render();
  api('/api/app/me').then(function (j) {
    if (!j.ok) { if (!store.get('token')) return; state.me = { name: '' }; }
    else state.me = j.officer;
    if (j.ok && j.push === false) store.set('pushOk', null);
    if (CAP) wireNative();
    else if ('serviceWorker' in navigator) navigator.serviceWorker.register('/pinaka/sw.js', { scope: '/pinaka/' }).catch(function () {});
    if (!store.get('pinHash')) { state.view = 'pin'; state.pinMode = 'set1'; }
    else if (store.get('unlocked') !== today()) { state.view = 'pin'; state.pinMode = 'unlock'; }
    else { goHome(); return; }
    render();
  });
  /* a second chance for the alarm while the app is open: ask every 20 seconds */
  setInterval(function () { if (store.get('token') && document.visibilityState === 'visible' && (state.view === 'home' || state.view === 'case' || state.view === 'profile')) loadAlarms(false); }, 20000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && store.get('token') && state.view !== 'pin' && state.view !== 'activate') { loadAlarms(true); loadCases(); } });
  if ('serviceWorker' in navigator && navigator.serviceWorker.addEventListener) navigator.serviceWorker.addEventListener('message', function (e) { if (e.data && e.data.type === 'pinaka-alarm') loadAlarms(true); });
  if (/[?#&]alarm=/.test(location.href)) setTimeout(function () { loadAlarms(true); }, 800);
})();
</script>
</body>
</html>
